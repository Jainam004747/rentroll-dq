name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile airflow/dags/rentroll_dq.py
      - run: pytest -q
      - name: Demo run (planted issues, expected to fail the checks)
        run: |
          python scripts/generate_data.py
          python scripts/backfill_history.py
          python -m dqmon run --operator github-actions || echo "checks failed as expected"
          python scripts/generate_data.py --clean
          python -m dqmon run --operator github-actions
          python -m dqmon verify
